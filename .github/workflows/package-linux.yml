# Portable Linux package: the program built against an official Qt and bundled
# with its libraries by linuxdeploy, shipped as a tarball of the AppDir:
#
#   rf-tools-<version>-linux-x86_64.tar.gz   run from usr/bin
#
# (The command line tools have no desktop file or icon, so no AppImage until
# there is a graphical application.)
#
# The Nix package (build-and-test.yml) is what Nix users get; this one is for
# everyone else, so it deliberately does not use Nix: Nix store paths are not
# portable to other distributions.
#
# SPDX-License-Identifier: GPL-3.0-or-later

name: Package Linux

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded Linux artifact
        required: false
        default: rf-tools-linux
        type: string
      retention_days:
        description: Artifact retention in days
        required: false
        default: 30
        type: number

permissions:
  contents: read

jobs:
  package:
    # The oldest supported runner, so the bundle's glibc floor stays low.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="git-${GITHUB_SHA:0:7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          # Kept aligned with the macOS and Windows packages.
          version: '6.9.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Configure and build
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF \
            -DAPP_BRANCH=github-actions \
            -DAPP_COMMIT=${{ steps.version.outputs.version }}
          cmake --build build --parallel
          for exe in rfx rf-requantize rf-analyse rf-packer; do
            test -x "build/bin/${exe}" || { echo "::error::${exe} was not built"; exit 1; }
          done

      - name: Install into AppDir
        shell: bash
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Fetch linuxdeploy
        shell: bash
        run: |
          mkdir -p tools-bin
          base=https://github.com/linuxdeploy
          curl -fsSL -o tools-bin/linuxdeploy \
            "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o tools-bin/linuxdeploy-plugin-qt \
            "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x tools-bin/*
          echo "$PWD/tools-bin" >> "$GITHUB_PATH"

      - name: Bundle libraries
        shell: bash
        env:
          # Runners have no FUSE; the AppImage tools unpack themselves instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: |
          set -euo pipefail

          exe_args=()
          # ELF binaries only
          for exe in AppDir/usr/bin/*; do
            [[ "$(head -c 4 "$exe")" == $'\x7fELF' ]] || continue
            exe_args+=(--executable "$exe")
          done

          linuxdeploy --appdir AppDir \
            "${exe_args[@]}" \
            --plugin qt

      - name: Smoke test bundled program
        shell: bash
        run: |
          set -euo pipefail
          AppDir/usr/bin/rfx --version
          AppDir/usr/bin/rf-requantize --version
          # The window is not started: there is no screen here. It must be bundled.
          test -x AppDir/usr/bin/rf-analyse
          test -x AppDir/usr/bin/rf-packer
          echo "rfx, rf-requantize, rf-analyse, rf-packer (AppDir): ok"

      - name: Assemble artifacts
        shell: bash
        run: |
          set -euo pipefail
          name="rf-tools-${{ steps.version.outputs.version }}-linux-x86_64"
          mkdir -p dist
          cp -a AppDir "dist/${name}"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
          ls -lh dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
