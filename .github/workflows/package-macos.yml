# macOS package: the command line program with the Qt framework it needs beside
# it, delivered as a tarball (a DMG when there is an application bundle).
#
# SPDX-License-Identifier: GPL-3.0-or-later

name: Package macOS

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded tarball artifact
        required: false
        default: rf-tools-macos
        type: string
      retention_days:
        description: Artifact retention in days
        required: false
        default: 30
        type: number

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="git-${GITHUB_SHA:0:7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          # A flaky Homebrew API download should not abort the build; fall back
          # to the existing metadata after a few attempts.
          for i in 1 2 3; do
            brew update && break
            echo "brew update failed (attempt $i), retrying..."
            sleep 15
          done || echo "brew update failed after retries; continuing with existing metadata"

          for dep in ninja pkg-config; do
            brew list --versions "$dep" > /dev/null 2>&1 || brew install "$dep"
          done

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.*'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Configure and build
        shell: bash
        run: |
          # Build for the runner's architecture only even though Qt itself is universal.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" \
            -DBUILD_TESTING=OFF \
            -DAPP_BRANCH=github-actions \
            -DAPP_COMMIT=${{ steps.version.outputs.version }}
          cmake --build build --parallel
          for exe in rfx rf-requantize; do
            test -x "build/bin/${exe}" || { echo "::error::${exe} was not built"; exit 1; }
          done

      # macdeployqt works on application bundles only: the program is not one, so
      # the Qt framework it loads is copied beside it and found through an rpath.
      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          name="rf-tools-${{ steps.version.outputs.version }}-macos-$(uname -m)"
          rm -rf package-root
          mkdir -p "package-root/${name}/bin" "package-root/${name}/lib"
          cp build/bin/rfx build/bin/rf-requantize "package-root/${name}/bin/"
          cp -R "${QT_ROOT_DIR}/lib/QtCore.framework" "package-root/${name}/lib/"
          rm -rf "package-root/${name}/lib/QtCore.framework/Headers" "package-root/${name}/lib/QtCore.framework/Versions/A/Headers"
          codesign --force --sign - --timestamp=none "package-root/${name}/lib/QtCore.framework"
          for exe in rfx rf-requantize; do
            install_name_tool -add_rpath "@executable_path/../lib" "package-root/${name}/bin/${exe}"
            codesign --force --sign - --timestamp=none "package-root/${name}/bin/${exe}"
          done
          cp README.md LICENSE "package-root/${name}/"
          echo "name=${name}" > package-root/name.env

      # (a library for both architectures has in the output of otool a line
      # "path (architecture arm64):" for each of them, which is not a dependency:
      # the lines that end with a colon are left out)
      - name: Verify standalone package
        shell: bash
        run: |
          set -euo pipefail
          source package-root/name.env
          FAIL=0
          while IFS= read -r target; do
            while IFS= read -r dep; do
              [[ -z "$dep" ]] && continue
              case "$dep" in
                /System/*|/usr/lib/*|@rpath/*|@loader_path/*|@executable_path/*)
                  ;;
                *)
                  echo "External dependency in $target: $dep" >&2
                  FAIL=1
                  ;;
              esac
            done < <(otool -L "$target" | tail -n +2 | grep -v ":$" | awk '{print $1}')
          done < <(
            echo "package-root/${name}/bin/rfx"
            echo "package-root/${name}/bin/rf-requantize"
            find "package-root/${name}/lib" -type f -perm -u+x
          )
          if [[ "$FAIL" -ne 0 ]]; then
            echo "Standalone verification failed" >&2
            exit 1
          fi

      - name: Smoke test packaged program
        shell: bash
        run: |
          set -euo pipefail
          source package-root/name.env
          "package-root/${name}/bin/rfx" --version
          "package-root/${name}/bin/rf-requantize" --version
          echo "rfx, rf-requantize: ok"

      - name: Create tarball
        shell: bash
        run: |
          set -euo pipefail
          source package-root/name.env
          mkdir -p dist
          tar -C package-root -czf "dist/${name}.tar.gz" "${name}"
          ls -lh dist

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
