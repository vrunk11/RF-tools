# Windows package: the program built with MSVC against an official Qt, with its
# Qt runtime beside it, delivered as a portable ZIP.
#
# SPDX-License-Identifier: GPL-3.0-or-later

name: Package Windows

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded ZIP artifact
        required: false
        default: rf-tools-windows
        type: string
      retention_days:
        description: Artifact retention in days
        required: false
        default: 30
        type: number

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "git-$($env:GITHUB_SHA.Substring(0,7))"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      # When the program has libraries of its own (see vcpkg.json), install
      # them here with the project-local vcpkg, as ld-decode-tools does: clone
      # vcpkg in full (it resolves the builtin-baseline from its history),
      # install with --x-manifest-root=. and add vcpkg_installed to
      # CMAKE_PREFIX_PATH and its bin to the package.
      - name: Configure and build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # MSVC environment for the Ninja generator. Using the dev shell
          # rather than a pinned "Visual Studio NN" generator keeps configure
          # working across runner image bumps.
          $vsPath = &"${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"

          # What the machine is and how long each part takes, so that a slow or a stuck run can be read in the log.
          $clock = [Diagnostics.Stopwatch]::StartNew()
          Write-Host "Runner: $env:RUNNER_OS $env:RUNNER_ARCH, $([Environment]::ProcessorCount) processors, $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)) GB of memory"
          Write-Host "Qt: $env:QT_ROOT_DIR"
          Write-Host "cmake $((cmake --version | Select-Object -First 1))"
          Write-Host "::group::Configure"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            -DAPP_BRANCH=github-actions `
            "-DAPP_COMMIT=${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "::endgroup::"
          Write-Host "Configured in $([math]::Round($clock.Elapsed.TotalSeconds)) s"
          $clock.Restart()
          Write-Host "::group::Build"
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "::endgroup::"
          Write-Host "Built in $([math]::Round($clock.Elapsed.TotalSeconds)) s"
          Get-ChildItem build\bin\*.exe | ForEach-Object { Write-Host ("  {0,-22} {1,12:N0} bytes" -f $_.Name, $_.Length) }
          foreach ($exe in "rfx.exe", "rf-requantize.exe", "rf-analyse.exe", "rf-packer.exe") {
            if (-not (Test-Path "build\bin\$exe")) {
              Write-Error "$exe was not built"
              exit 1
            }
          }

      - name: Assemble package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "rf-tools-${{ steps.version.outputs.version }}-windows-x64"
          $stage = "dist\$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item build\bin\rfx.exe, build\bin\rf-requantize.exe, build\bin\rf-analyse.exe, build\bin\rf-packer.exe $stage

          # Qt runtime (the programs sit in one directory and share it; the window
          # needs Widgets and the platform plugin, which windeployqt adds for it)
          & windeployqt --release --no-translations "$stage\rfx.exe" "$stage\rf-analyse.exe" "$stage\rf-packer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item README.md, LICENSE $stage

      - name: Describe the package
        # (what is in it, and which library each program needs and where it is found: the log tells what is missing before a program is started)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $stage = Get-ChildItem -Path dist -Directory | Select-Object -First 1
          Write-Host "::group::Files of the package"
          Get-ChildItem $stage.FullName -Recurse -File | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.FullName.Substring($stage.FullName.Length + 1) }
          Write-Host "::endgroup::"
          $vsPath = &"${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          $missing = 0
          foreach ($exe in "rfx.exe", "rf-requantize.exe", "rf-analyse.exe", "rf-packer.exe") {
            Write-Host "::group::Libraries $exe needs"
            $needs = & dumpbin /dependents "$($stage.FullName)\$exe" | Select-String '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
            foreach ($dll in $needs) {
              if (Test-Path "$($stage.FullName)\$dll") { $where = "package" }
              elseif (Test-Path "$env:SystemRoot\System32\$dll") { $where = "system" }
              elseif ($dll -like "api-ms-win-*" -or $dll -like "ext-ms-*") { $where = "system (api set)" }
              else { $where = "MISSING" }
              Write-Host ("  {0,-34} {1}" -f $dll, $where)
              if ($where -eq "MISSING") {
                $missing++
                Write-Host "::error::$exe needs $dll, which is neither in the package nor in the system"
              }
            }
            Write-Host "::endgroup::"
          }
          if ($missing -gt 0) { exit 1 }

      - name: Smoke test packaged program
        # (a program that does not start, a missing library for instance, must fail here in minutes with what it said, not wait for the hour of the job)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $stage = Get-ChildItem -Path dist -Directory | Select-Object -First 1
          $empty = Join-Path $env:RUNNER_TEMP "empty-input.txt"
          New-Item -ItemType File -Force -Path $empty | Out-Null
          foreach ($exe in "rfx.exe", "rf-requantize.exe") {
            $out = Join-Path $env:RUNNER_TEMP "$exe.out.txt"
            $err = Join-Path $env:RUNNER_TEMP "$exe.err.txt"
            # Started apart, with nothing to read on its input, and given 30 seconds.
            $process = Start-Process -FilePath "$($stage.FullName)\$exe" -ArgumentList "--version" -NoNewWindow -PassThru `
              -RedirectStandardInput $empty -RedirectStandardOutput $out -RedirectStandardError $err
            $null = $process.Handle   # (keeps the handle, or the exit code is lost)
            $began = Get-Date
            Write-Host "$(Get-Date -Format HH:mm:ss) $exe --version started (process $($process.Id))"
            if (-not $process.WaitForExit(30000)) {
              $process.Kill()
              Write-Host "::error::$exe --version did not end in 30 seconds"
              Write-Host "Output: $(Get-Content $out -Raw)"
              Write-Host "Errors: $(Get-Content $err -Raw)"
              Write-Host "Libraries beside it:"
              Get-ChildItem $stage.FullName -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)" }
              exit 1
            }
            Write-Host (Get-Content $out -Raw)
            Write-Host "$(Get-Date -Format HH:mm:ss) $exe ended with code $($process.ExitCode) after $([math]::Round(((Get-Date) - $began).TotalSeconds, 1)) s"
            if ($process.ExitCode -ne 0) {
              Write-Host "::error::$exe --version exited with $($process.ExitCode)"
              Write-Host "Errors: $(Get-Content $err -Raw)"
              exit 1
            }
          }
          # The window is not started: there is no screen here. It must be there, with
          # the Qt it needs.
          foreach ($file in "rf-analyse.exe", "rf-packer.exe", "Qt6Widgets.dll", "platforms\qwindows.dll") {
            if (-not (Test-Path "$($stage.FullName)\$file")) {
              Write-Host "::error::$file is not in the package"
              exit 1
            }
          }
          Write-Host "rfx, rf-requantize, rf-analyse, rf-packer: ok"

      - name: Create ZIP
        shell: pwsh
        run: |
          $stage = Get-ChildItem -Path dist -Directory | Select-Object -First 1
          Compress-Archive -Path $stage.FullName -DestinationPath "dist\$($stage.Name).zip"
          Get-ChildItem dist\*.zip | ForEach-Object {
            Write-Host "$($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)"
          }

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
